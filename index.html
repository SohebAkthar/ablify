<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abilify - Empowering Every Ability</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Splash CSS -->
    <link rel="stylesheet" href="css/splash.css">
</head>
<body>
    
    <div class="splash-container">
        <!-- Animated Background Elements -->
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
        </div>
        
        <!-- Main Content -->
        <div class="splash-content">
            <!-- Logo Container with Animation -->
            <div class="logo-wrapper">
                <div class="logo-circle">
                    <img src="assets/abilify-logo.png" alt="Abilify Logo" class="logo-image">
                </div>
            </div>
            
            <!-- Brand Name -->
            <h1 class="brand-name">ABILIFY</h1>
            
            <!-- Tagline -->
            <p class="tagline">A UNIFIED PLATFORM FOR DISABLES USING AI</p>
            
            <!-- Loading Animation -->
            <div class="loading-container">
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
                <p class="loading-text">Loading your experience...</p>
            </div>
        </div>
        
        <!-- Bottom Decorative Line -->
        <div class="bottom-decoration"></div>
    </div>

    <!-- JavaScript for Auto-Redirect -->
    <script src="js/splash.js"></script>
</body>
</html>
